<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#F5C042" />
      <stop offset="100%" stop-color="#D49B28" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer circular frame badge -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4" stroke-dasharray="8 6"/>
  <circle cx="250" cy="250" r="205" fill="#5F0910" stroke="url(#goldGrad)" stroke-width="5" filter="url(#shadow)"/>
  
  <!-- Subtle pattern ring -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>

  <!-- Asian / Andean geometric ornamental touches inside ring -->
  <path d="M 250 55 L 255 70 L 250 85 L 245 70 Z" fill="url(#goldGrad)"/>
  <path d="M 250 415 L 255 430 L 250 445 L 245 430 Z" fill="url(#goldGrad)"/>
  <path d="M 55 250 L 70 255 L 85 250 L 70 245 Z" fill="url(#goldGrad)"/>
  <path d="M 415 250 L 430 255 L 445 250 L 430 245 Z" fill="url(#goldGrad)"/>

  <!-- Stylized Wok bowl base -->
  <path d="M 140 260 C 140 335, 360 335, 360 260 C 340 265, 160 265, 140 260 Z" fill="url(#goldGrad)"/>
  
  <!-- Wok handles -->
  <path d="M 125 245 C 115 245, 115 270, 135 270 C 137 265, 133 248, 125 245 Z" fill="url(#goldGrad)"/>
  <path d="M 375 245 C 385 245, 385 270, 365 270 C 363 265, 367 248, 375 245 Z" fill="url(#goldGrad)"/>

  <!-- Dynamic Dragon Flame rising from the wok -->
  <path d="M 250 110 C 265 145, 290 170, 275 205 C 295 185, 305 155, 300 135 C 315 165, 325 210, 295 245 C 285 230, 280 220, 270 225 C 280 245, 270 260, 250 265 C 230 260, 220 245, 230 225 C 220 220, 215 230, 205 245 C 175 210, 185 165, 200 135 C 195 155, 205 185, 225 205 C 210 170, 235 145, 250 110 Z" fill="#FFFFFF"/>
  
  <!-- Inner dragon accent / gold fire heart -->
  <path d="M 250 145 C 260 175, 280 195, 265 225 C 255 210, 245 210, 235 225 C 220 195, 240 175, 250 145 Z" fill="url(#goldGrad)"/>
  
  <!-- Dragon eye dot -->
  <circle cx="250" cy="180" r="5" fill="#5F0910"/>

  <!-- Chopsticks crossed elegantly behind or above wok rim -->
  <line x1="160" y1="210" x2="330" y2="280" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="340" y1="210" x2="170" y2="280" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- Brand Typography Curved / Centered -->
  <text x="250" y="360" text-anchor="middle" fill="url(#goldGrad)" font-family="'Montserrat', 'Cinzel', 'Trajan Pro', sans-serif" font-size="28" font-weight="900" letter-spacing="8">CHIFA WOK</text>
  <text x="250" y="385" text-anchor="middle" fill="#FFFFFF" opacity="0.85" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" letter-spacing="4">FUSIÓN &amp; TRADICIÓN</text>
</svg>
